<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mint PLM · 软件生命周期管理系统，覆盖产品、项目、测试、知识、效能、协作、自动化与智能协同" />

    <!--
      依赖通过 import map 指向本地 vendor 目录中的 ESM 产物：
      · 浏览器直接运行（无需构建）
      · 使用 Vite 时，裸模块说明符由 node_modules 解析，本 importmap 不生效也不冲突
    -->
    <script type="importmap">
      {
        "imports": {
          "vue": "./vendor/vue.js",
          "vue-router": "./vendor/vue-router.js",
          "pinia": "./vendor/pinia.js",
          "axios": "./vendor/axios.js",
          "element-plus": "./vendor/element-plus.js",
          "element-plus/es/locale/lang/zh-cn": "./vendor/element-plus-zh-cn.js",
          "vue-demi": "./vendor/vue-demi.js",
          "@vue/devtools-api": "./vendor/devtools-api/index.js",
          "echarts": "./vendor/echarts.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot-screen">
        <div class="boot-logo">M</div>
        <div class="boot-text">正在加载 Mint PLM…</div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
