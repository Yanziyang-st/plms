# ============================================================================
# Nacos profile：启用服务注册（README 技术栈：服务发现 Nacos）
# 启动方式：java -jar plms-service.jar --spring.profiles.active=nacos
# 前置条件：Nacos 已启动（D:\nacos-server-2.5.4\nacos\bin\startup.cmd -m standalone）
# ============================================================================
plms:
  nacos:
    enabled: true
    server-addr: 127.0.0.1:8848
    group: DEFAULT_GROUP
    cluster-name: DEFAULT

logging:
  level:
    com.alibaba.nacos: WARN
    com.alibaba.nacos.client.naming: ERROR
